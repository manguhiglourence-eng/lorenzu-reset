<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - Lorenzu</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      background-color: #121212;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
      box-sizing: border-box;
    }
    .card {
      background-color: #1e1e1e;
      border: 1px solid #2d2d2d;
      border-radius: 12px;
      padding: 32px 24px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      text-align: center;
    }
    h2 {
      margin-top: 0;
      margin-bottom: 8px;
      font-size: 24px;
      color: #ffffff;
    }
    p.subtitle {
      color: #9e9e9e;
      font-size: 14px;
      margin-bottom: 24px;
    }
    input {
      width: 100%;
      padding: 12px 14px;
      margin-bottom: 16px;
      background-color: #2a2a2a;
      border: 1px solid #3d3d3d;
      border-radius: 8px;
      color: #ffffff;
      font-size: 15px;
      box-sizing: border-box;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus {
      border-color: #10b981;
    }
    button {
      width: 100%;
      padding: 14px;
      background-color: #10b981;
      border: none;
      border-radius: 8px;
      color: #ffffff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s, opacity 0.2s;
    }
    button:hover {
      background-color: #059669;
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    #status-msg {
      margin-top: 18px;
      font-size: 14px;
      min-height: 20px;
      word-break: break-word;
    }
    .error {
      color: #ef4444;
    }
    .success {
      color: #10b981;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Reset Password</h2>
    <p class="subtitle">Enter your new password below.</p>

    <input type="password" id="new-password" placeholder="New password" />
    <input type="password" id="confirm-password" placeholder="Confirm new password" />

    <button id="submit-btn" onclick="handlePasswordReset()">Update Password</button>

    <div id="status-msg"></div>
  </div>

  <script>
    const SUPABASE_URL = 'https://mborjinayvjckvamvnst.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1ib3JqaW5heXZqY2t2YW12bnN0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA3NTkyODEsImV4cCI6MjEwNjMzNTI4MX0.q9xPxBZGSHAyTNFQG7x3tqHIHnB46N9v-S5e59_fA1g';

    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: {
        detectSessionInUrl: true,
        persistSession: true,
        autoRefreshToken: true
      }
    });

    let isSessionReady = false;

    function setSuccessState(text) {
      isSessionReady = true;
      const msg = document.getElementById('status-msg');
      msg.className = 'success';
      msg.innerText = text || 'Authenticated. Please enter your new password.';
    }

    function setErrorState(text) {
      const msg = document.getElementById('status-msg');
      msg.className = 'error';
      msg.innerText = text;
    }

    async function initRecoverySession() {
      const searchParams = new URLSearchParams(window.location.search);
      const hash = window.location.hash;

      // 1. Check if error was passed in URL (expired/used link)
      const errorDescription = searchParams.get('error_description') || 
        (hash ? new URLSearchParams(hash.substring(1)).get('error_description') : null);
      if (errorDescription) {
        setErrorState('Link error: ' + errorDescription.replace(/\+/g, ' '));
        return;
      }

      // 2. Direct Hash Extraction (#access_token=...&refresh_token=...)
      if (hash && hash.includes('access_token')) {
        const hashParams = new URLSearchParams(hash.substring(1));
        const accessToken = hashParams.get('access_token');
        const refreshToken = hashParams.get('refresh_token');

        if (accessToken && refreshToken) {
          const { error } = await supabaseClient.auth.setSession({
            access_token: accessToken,
            refresh_token: refreshToken
          });
          if (error) {
            setErrorState('Failed to restore session: ' + error.message);
            return;
          }
          setSuccessState();
          return;
        }
      }

      // 3. Fallback: check if supabase client already established session
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session) {
        setSuccessState();
      } else {
        setTimeout(async () => {
          const { data: { session: retrySession } } = await supabaseClient.auth.getSession();
          if (retrySession) {
            setSuccessState();
          } else if (!isSessionReady) {
            setErrorState('Recovery token missing or expired. Please request a new link.');
          }
        }, 1500);
      }
    }

    supabaseClient.auth.onAuthStateChange(async (event, session) => {
      if (event === 'PASSWORD_RECOVERY' || (event === 'SIGNED_IN' && session)) {
        setSuccessState();
      }
    });

    async function handlePasswordReset() {
      const password = document.getElementById('new-password').value;
      const confirmPassword = document.getElementById('confirm-password').value;
      const btn = document.getElementById('submit-btn');

      if (!isSessionReady) {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (!session) {
          setErrorState('Error: Auth session missing! The reset link might be expired or used. Please request a new one.');
          return;
        }
        isSessionReady = true;
      }

      if (!password || password.length < 6) {
        setErrorState('Password must be at least 6 characters.');
        return;
      }

      if (password !== confirmPassword) {
        setErrorState('Passwords do not match.');
        return;
      }

      btn.disabled = true;
      const msg = document.getElementById('status-msg');
      msg.className = '';
      msg.innerText = 'Updating password...';

      const { data, error } = await supabaseClient.auth.updateUser({
        password: password
      });

      if (error) {
        setErrorState('Error: ' + error.message);
        btn.disabled = false;
      } else {
        msg.className = 'success';
        msg.innerText = 'Password updated successfully! You can now log into the app.';
        document.getElementById('new-password').style.display = 'none';
        document.getElementById('confirm-password').style.display = 'none';
        btn.style.display = 'none';
      }
    }

    window.addEventListener('DOMContentLoaded', initRecoverySession);
  </script>
</body>
</html>
