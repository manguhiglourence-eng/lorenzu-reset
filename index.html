<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - Lorenzu</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      background-color: #121212;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
      box-sizing: border-box;
    }
    .card {
      background-color: #1e1e1e;
      border: 1px solid #2d2d2d;
      border-radius: 12px;
      padding: 32px 24px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      text-align: center;
    }
    h2 {
      margin-top: 0;
      margin-bottom: 8px;
      color: #ffffff;
      font-size: 22px;
    }
    p.subtitle {
      color: #a0a0a0;
      font-size: 14px;
      margin-bottom: 24px;
    }
    input {
      width: 100%;
      padding: 12px 14px;
      margin-bottom: 16px;
      border: 1px solid #3d3d3d;
      border-radius: 8px;
      background-color: #2a2a2a;
      color: #ffffff;
      font-size: 15px;
      box-sizing: border-box;
      outline: none;
    }
    input:focus {
      border-color: #3ecf8e;
    }
    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background-color: #3ecf8e;
      color: #121212;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover {
      opacity: 0.9;
    }
    button:disabled {
      background-color: #555555;
      cursor: not-allowed;
    }
    #status-msg {
      margin-top: 18px;
      font-size: 14px;
      line-height: 1.4;
    }
    .success { color: #3ecf8e; }
    .error { color: #ff6b6b; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Reset Password</h2>
    <p class="subtitle">Enter your new password below.</p>

    <input type="password" id="new-password" placeholder="New password" />
    <input type="password" id="confirm-password" placeholder="Confirm new password" />

    <button id="submit-btn" onclick="handlePasswordReset()">Update Password</button>

    <div id="status-msg"></div>
  </div>

  <script>
    const SUPABASE_URL = 'https://mborjinayvjckvamvnst.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1ib3JqaW5heXZqY2t2YW12bnN0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA3NTkyODEsImV4cCI6MjEwNjMzNTI4MX0.q9xPxBZGSHAyTNFQG7x3tqHIHnB46N9v-S5e59_fA1g';

    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let isSessionReady = false;

    // Handle authentication setup on page load
    async function initRecoverySession() {
      const msg = document.getElementById('status-msg');
      const hash = window.location.hash;
      const searchParams = new URLSearchParams(window.location.search);
      const code = searchParams.get('code');

      // 1. Check if PKCE code flow was passed (?code=...)
      if (code) {
        msg.className = '';
        msg.innerText = 'Verifying security token...';
        const { error } = await supabaseClient.auth.exchangeCodeForSession(code);
        if (error) {
          msg.className = 'error';
          msg.innerText = 'Link expired or invalid: ' + error.message;
          return;
        }
        isSessionReady = true;
        msg.className = 'success';
        msg.innerText = 'Authenticated. Please enter your new password.';
        return;
      }

      // 2. Check if implicit hash fragment was passed (#access_token=...)
      if (hash && hash.includes('access_token')) {
        const hashParams = new URLSearchParams(hash.substring(1));
        const accessToken = hashParams.get('access_token');
        const refreshToken = hashParams.get('refresh_token');

        if (accessToken && refreshToken) {
          const { error } = await supabaseClient.auth.setSession({
            access_token: accessToken,
            refresh_token: refreshToken
          });
          if (error) {
            msg.className = 'error';
            msg.innerText = 'Failed to restore session: ' + error.message;
            return;
          }
          isSessionReady = true;
          msg.className = 'success';
          msg.innerText = 'Authenticated. Please enter your new password.';
          return;
        }
      }

      // 3. Fallback check for an existing session
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session) {
        isSessionReady = true;
        msg.className = 'success';
        msg.innerText = 'Authenticated. Please enter your new password.';
      } else {
        msg.className = 'error';
        msg.innerText = 'Recovery token missing. Please request a new reset link.';
      }
    }

    supabaseClient.auth.onAuthStateChange(async (event, session) => {
      if (event === 'PASSWORD_RECOVERY' || (event === 'SIGNED_IN' && session)) {
        isSessionReady = true;
        const msg = document.getElementById('status-msg');
        msg.className = 'success';
        msg.innerText = 'Authenticated. Please enter your new password.';
      }
    });

    async function handlePasswordReset() {
      const password = document.getElementById('new-password').value;
      const confirmPassword = document.getElementById('confirm-password').value;
      const msg = document.getElementById('status-msg');
      const btn = document.getElementById('submit-btn');

      if (!isSessionReady) {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (!session) {
          msg.className = 'error';
          msg.innerText = 'Error: Auth session missing! The reset link might be expired or used. Please request a new one.';
          return;
        }
        isSessionReady = true;
      }

      if (!password || password.length < 6) {
        msg.className = 'error';
        msg.innerText = 'Password must be at least 6 characters.';
        return;
      }

      if (password !== confirmPassword) {
        msg.className = 'error';
        msg.innerText = 'Passwords do not match.';
        return;
      }

      btn.disabled = true;
      msg.className = '';
      msg.innerText = 'Updating password...';

      const { data, error } = await supabaseClient.auth.updateUser({
        password: password
      });

      if (error) {
        msg.className = 'error';
        msg.innerText = 'Error: ' + error.message;
        btn.disabled = false;
      } else {
        msg.className = 'success';
        msg.innerText = 'Password updated successfully! You can now log into the app.';
        document.getElementById('new-password').style.display = 'none';
        document.getElementById('confirm-password').style.display = 'none';
        btn.style.display = 'none';
      }
    }

    window.addEventListener('DOMContentLoaded', initRecoverySession);
  </script>
